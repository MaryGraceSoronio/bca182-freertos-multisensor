<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 545" width="980" height="545" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="980" height="545" fill="#ffffff"/>

  <text x="24" y="30" font-size="20" font-weight="700" fill="#0f172a">System state machine (sections 32&#8211;34)</text>
  <text x="24" y="52" font-size="13" fill="#475569">Two states, one timeout edge, one motion edge. StateTask runs it; evaluateSystemState() decides it.</text>

  <!-- boot entry -->
  <circle cx="75" cy="150" r="13" fill="#0f172a"/>
  <text x="56" y="155" font-size="12" fill="#334155" text-anchor="end">boot</text>
  <line x1="75" y1="163" x2="158" y2="186" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>

  <!-- ACTIVE state -->
  <rect x="150" y="180" width="340" height="180" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="214" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">ACTIVE</text>
  <g font-size="12.5" fill="#334155" text-anchor="middle">
    <text x="320" y="248">OLED on: page redrawn on every sample</text>
    <text x="320" y="274">rotary encoder changes the page</text>
    <text x="320" y="300">temperature alarm drives the buzzer</text>
    <text x="320" y="326">EVENT_ACTIVE is set</text>
  </g>

  <!-- INACTIVE state -->
  <rect x="590" y="180" width="340" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="760" y="214" font-size="17" font-weight="700" fill="#7c2d12" text-anchor="middle">INACTIVE</text>
  <g font-size="12.5" fill="#334155" text-anchor="middle">
    <text x="760" y="248">OLED blanked once, then left dark</text>
    <text x="760" y="274">encoder detents consumed and ignored</text>
    <text x="760" y="300">sampling, PIR polling and alarm still run</text>
    <text x="760" y="326">EVENT_ACTIVE is clear</text>
  </g>

  <!-- ACTIVE -> INACTIVE : inactivity timeout -->
  <path d="M 490 210 C 520 155, 560 155, 590 210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="540" y="130" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">inactivity timeout: 15 s</text>
  <text x="540" y="148" font-size="12" fill="#334155" text-anchor="middle">wait expires with no EVENT_MOTION</text>

  <!-- INACTIVE -> ACTIVE : motion -->
  <path d="M 590 330 C 560 385, 520 385, 490 330" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="540" y="418" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">motion detected (PIR OUT high)</text>
  <text x="540" y="436" font-size="12" fill="#334155" text-anchor="middle">EVENT_MOTION set by MotionTask</text>

  <!-- self loop on ACTIVE -->
  <path d="M 210 180 C 220 135, 290 135, 300 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="255" y="124" font-size="12" fill="#475569" text-anchor="middle">motion while ACTIVE: no change</text>

  <!-- self loop on INACTIVE -->
  <path d="M 730 180 C 740 135, 810 135, 820 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="775" y="124" font-size="12" fill="#475569" text-anchor="middle">timeout while INACTIVE: no change</text>

  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="490" y="478">evaluateSystemState() in include/system_state.h is pure: motion always wins &#8594; ACTIVE, otherwise a timeout while ACTIVE &#8594; INACTIVE;</text>
    <text x="490" y="498">every other combination keeps the current state. StateTask prints the new state and flips EVENT_ACTIVE only on a real transition.</text>
    <text x="490" y="518">Boot state is ACTIVE: the machine publishes "State: ACTIVE" before any consumer can read a stale event group.</text>
  </g>
</svg>
