<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1210" width="1120" height="1210" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1120" height="1210" fill="#ffffff"/>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#0f172a">Wokwi circuit &#8212; STM32 Blue Pill multisensor</text>
  <text x="30" y="56" font-size="12.5" fill="#475569">All 8 parts and all 24 connections declared in diagram.json &#183; wire colours follow the file &#183; schematic layout</text>

  <!-- ================= STM32 Blue Pill ================= -->
  <rect x="40" y="76" width="420" height="1074" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="250" y="106" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">STM32 Blue Pill</text>
  <text x="250" y="126" font-size="11.5" fill="#64748b" text-anchor="middle">board-stm32-bluepill &#183; id stm32 &#183; STM32F103C8T6</text>
  <circle cx="76" cy="166" r="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="170" font-size="11" fill="#475569">PC13 &#183; onboard LED (configured, not wired)</text>
  <text x="56" y="1136" font-size="11" fill="#64748b">72 MHz &#183; 64 KB flash &#183; 20 KB RAM &#183; FreeRTOS kernel</text>

  <!-- pin labels + connection dots -->
  <g fill="#0f172a" font-size="12.5" text-anchor="end">
    <text x="450" y="164">PA9   TX &#183; USART1</text>
    <text x="450" y="196">PA10  RX &#183; USART1</text>
    <text x="450" y="364">PA1   DHT22 SDA</text>
    <text x="450" y="496">PA0   LDR AO &#183; ADC1_IN0</text>
    <text x="450" y="610">PB6   I2C1 SCL</text>
    <text x="450" y="646">PB7   I2C1 SDA</text>
    <text x="450" y="742">PB0   buzzer drive</text>
    <text x="450" y="858">PB8   PIR OUT</text>
    <text x="450" y="968">PB12  encoder CLK</text>
    <text x="450" y="1002">PB13  encoder DT</text>
    <text x="450" y="1036">PB14  encoder SW</text>
    <text x="450" y="1088">3V3</text>
    <text x="450" y="1118">GND</text>
  </g>
  <g fill="#334155">
    <circle cx="460" cy="160" r="3"/><circle cx="460" cy="192" r="3"/>
    <circle cx="460" cy="360" r="3"/><circle cx="460" cy="492" r="3"/>
    <circle cx="460" cy="606" r="3"/><circle cx="460" cy="642" r="3"/>
    <circle cx="460" cy="738" r="3"/><circle cx="460" cy="854" r="3"/>
    <circle cx="460" cy="964" r="3"/><circle cx="460" cy="998" r="3"/>
    <circle cx="460" cy="1032" r="3"/><circle cx="460" cy="1084" r="3"/>
    <circle cx="460" cy="1114" r="3"/>
  </g>

  <!-- ================= rails ================= -->
  <line x1="1010" y1="275" x2="1010" y2="1090" stroke="#dc2626" stroke-width="3"/>
  <line x1="1055" y1="316" x2="1055" y2="1124" stroke="#111827" stroke-width="3"/>

  <!-- ================= signal wires (MCU -> parts) ================= -->
  <g stroke-width="2.5" stroke-linecap="round" fill="none">
    <line x1="460" y1="160" x2="640" y2="160" stroke="#16a34a"/>
    <line x1="460" y1="192" x2="640" y2="192" stroke="#16a34a"/>
    <line x1="460" y1="360" x2="640" y2="360" stroke="#2563eb"/>
    <line x1="460" y1="492" x2="640" y2="492" stroke="#ea580c"/>
    <line x1="460" y1="606" x2="640" y2="606" stroke="#7c3aed"/>
    <line x1="460" y1="642" x2="640" y2="642" stroke="#7c3aed"/>
    <line x1="460" y1="738" x2="640" y2="738" stroke="#16a34a"/>
    <line x1="460" y1="854" x2="640" y2="854" stroke="#ea580c"/>
    <line x1="460" y1="964" x2="640" y2="964" stroke="#ca8a04"/>
    <line x1="460" y1="998" x2="640" y2="998" stroke="#ea580c"/>
    <line x1="460" y1="1032" x2="640" y2="1032" stroke="#2563eb"/>
    <!-- 10 k pull-up tap onto the DHT22 data line -->
    <path d="M 612 281 H 640" stroke="#2563eb"/>
    <path d="M 612 281 V 360" stroke="#2563eb"/>
  </g>
  <circle cx="612" cy="360" r="3.5" fill="#2563eb"/>

  <!-- ================= VCC (red) stubs into the 3V3 rail ================= -->
  <g stroke="#dc2626" stroke-width="2.5" stroke-linecap="round">
    <line x1="800" y1="281" x2="1010" y2="281"/>
    <line x1="940" y1="336" x2="1010" y2="336"/>
    <line x1="940" y1="468" x2="1010" y2="468"/>
    <line x1="940" y1="588" x2="1010" y2="588"/>
    <line x1="940" y1="818" x2="1010" y2="818"/>
    <line x1="940" y1="940" x2="1010" y2="940"/>
    <line x1="460" y1="1084" x2="1010" y2="1084"/>
  </g>
  <g fill="#dc2626">
    <circle cx="1010" cy="281" r="3.5"/><circle cx="1010" cy="336" r="3.5"/>
    <circle cx="1010" cy="468" r="3.5"/><circle cx="1010" cy="588" r="3.5"/>
    <circle cx="1010" cy="818" r="3.5"/><circle cx="1010" cy="940" r="3.5"/>
    <circle cx="1010" cy="1084" r="3.5"/>
  </g>

  <!-- ================= GND (black) stubs, drawn over the red rail ================= -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="butt">
    <line x1="940" y1="420" x2="1055" y2="420"/>
    <line x1="940" y1="534" x2="1055" y2="534"/>
    <line x1="940" y1="664" x2="1055" y2="664"/>
    <line x1="940" y1="764" x2="1055" y2="764"/>
    <line x1="940" y1="886" x2="1055" y2="886"/>
    <line x1="940" y1="1042" x2="1055" y2="1042"/>
    <line x1="460" y1="1114" x2="1055" y2="1114"/>
  </g>
  <g stroke="#111827" stroke-width="2.5" stroke-linecap="round">
    <line x1="940" y1="420" x2="1055" y2="420"/>
    <line x1="940" y1="534" x2="1055" y2="534"/>
    <line x1="940" y1="664" x2="1055" y2="664"/>
    <line x1="940" y1="764" x2="1055" y2="764"/>
    <line x1="940" y1="886" x2="1055" y2="886"/>
    <line x1="940" y1="1042" x2="1055" y2="1042"/>
    <line x1="460" y1="1114" x2="1055" y2="1114"/>
  </g>
  <g fill="#111827">
    <circle cx="1055" cy="420" r="3.5"/><circle cx="1055" cy="534" r="3.5"/>
    <circle cx="1055" cy="664" r="3.5"/><circle cx="1055" cy="764" r="3.5"/>
    <circle cx="1055" cy="886" r="3.5"/><circle cx="1055" cy="1042" r="3.5"/>
    <circle cx="1055" cy="1114" r="3.5"/>
  </g>

  <!-- ================= pin labels beside the parts ================= -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="634" y="154">RX</text>
    <text x="634" y="186">TX</text>
    <text x="634" y="354">SDA</text>
    <text x="634" y="486">AO</text>
    <text x="634" y="600">SCL</text>
    <text x="634" y="636">SDA</text>
    <text x="634" y="732">2 (+)</text>
    <text x="634" y="848">OUT</text>
    <text x="634" y="958">CLK</text>
    <text x="634" y="992">DT</text>
    <text x="634" y="1026">SW</text>
  </g>
  <g font-size="11" fill="#334155" text-anchor="start">
    <text x="946" y="330">VCC</text>
    <text x="946" y="414">GND</text>
    <text x="946" y="462">VCC</text>
    <text x="946" y="530">GND</text>
    <text x="946" y="582">VCC</text>
    <text x="946" y="658">GND</text>
    <text x="946" y="758">1 (&#8722;)</text>
    <text x="946" y="812">VCC</text>
    <text x="946" y="880">GND</text>
    <text x="946" y="934">VCC</text>
    <text x="946" y="1036">GND</text>
  </g>

  <!-- ================= parts ================= -->
  <g fill="#f8fafc" stroke="#334155" stroke-width="2">
    <rect x="640" y="148" width="300" height="88" rx="8"/>
    <rect x="640" y="316" width="300" height="120" rx="8"/>
    <rect x="640" y="456" width="300" height="90" rx="8"/>
    <rect x="640" y="576" width="300" height="100" rx="8"/>
    <rect x="640" y="706" width="300" height="70" rx="8"/>
    <rect x="640" y="806" width="300" height="92" rx="8"/>
    <rect x="640" y="928" width="300" height="124" rx="8"/>
  </g>
  <rect x="640" y="260" width="160" height="42" rx="6" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>

  <g fill="#0f172a" font-size="13.5" font-weight="700">
    <text x="656" y="182">Serial monitor</text>
    <text x="656" y="348">DHT22 &#183; wokwi-dht22</text>
    <text x="656" y="482">Photoresistor (LDR)</text>
    <text x="656" y="602">SSD1306 OLED &#183; board-ssd1306</text>
    <text x="656" y="732">Buzzer &#183; wokwi-buzzer</text>
    <text x="656" y="832">PIR motion sensor</text>
    <text x="656" y="954">KY-040 rotary encoder</text>
  </g>
  <g fill="#64748b" font-size="11">
    <text x="656" y="204">$serialMonitor &#183; USART1 115200 8N1</text>
    <text x="656" y="222">host PC receives every diagnostic line</text>
    <text x="656" y="370">temperature 25.4 &#176;C &#183; humidity 61.2 %</text>
    <text x="656" y="390">single-wire bus on PA1, 10 k&#8486; pull-up</text>
    <text x="656" y="504">wokwi-photoresistor-sensor &#183; lux 500</text>
    <text x="656" y="524">AO &#8594; ADC1_IN0, 12-bit single conversion</text>
    <text x="656" y="624">128 &#215; 64 &#183; I&#185;C address 0x3C</text>
    <text x="656" y="644">only DisplayTask touches I2C1</text>
    <text x="656" y="754">passive piezo, driven high by PB0</text>
    <text x="656" y="854">wokwi-pir-motion-sensor &#183; active high</text>
    <text x="656" y="874">re-triggers: OUT stays high while motion</text>
    <text x="656" y="976">wokwi-ky-040 &#183; CLK / DT / SW</text>
    <text x="656" y="996">page navigation, rotation only</text>
  </g>
  <text x="720" y="278" font-size="12" font-weight="700" fill="#713f12" text-anchor="middle">R_dht &#183; 10 k&#8486;</text>
  <text x="720" y="295" font-size="10" fill="#a16207" text-anchor="middle">pin 2 &#8594; PA1 &#183; pin 1 &#8594; 3V3</text>

  <!-- ================= legend ================= -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="1172" x2="66" y2="1172" stroke="#dc2626"/>
    <line x1="190" y1="1172" x2="216" y2="1172" stroke="#111827"/>
    <line x1="340" y1="1172" x2="366" y2="1172" stroke="#16a34a"/>
    <line x1="490" y1="1172" x2="516" y2="1172" stroke="#2563eb"/>
    <line x1="640" y1="1172" x2="666" y2="1172" stroke="#ea580c"/>
    <line x1="790" y1="1172" x2="816" y2="1172" stroke="#7c3aed"/>
    <line x1="940" y1="1172" x2="966" y2="1172" stroke="#ca8a04"/>
  </g>
  <g font-size="11" fill="#334155">
    <text x="72" y="1176">3V3 rail</text>
    <text x="222" y="1176">GND rail</text>
    <text x="372" y="1176">UART / buzzer</text>
    <text x="522" y="1176">SDA / encoder SW</text>
    <text x="672" y="1176">AO / OUT / DT</text>
    <text x="822" y="1176">I2C1</text>
    <text x="972" y="1176">encoder CLK</text>
    <text x="40" y="1198" font-size="11" fill="#64748b">A junction dot marks a connection. A black GND wire crosses the red 3V3 rail without a dot: the wires pass over each other and are not joined.</text>
  </g>
</svg>
