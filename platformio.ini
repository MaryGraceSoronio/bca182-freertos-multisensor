; BCA182 Embedded Systems Programming
; Laboratory Activity No. 1 - Real-Time Multisensor Room Monitoring System
;
; Framework is STM32Cube (HAL + CMSIS). The Arduino framework is prohibited
; by section 6 / section 13 of the laboratory specification.
;
; PlatformIO's stm32cube builder does not compile the FreeRTOS kernel that
; ships inside framework-stm32cubef1, so scripts/freertos_build.py wires it
; in. See the header of that script for details.

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:scripts/freertos_build.py
