; BCA182 Embedded Systems Programming
; Laboratory Activity No. 1 - Real-Time Multisensor Room Monitoring System
;
; Framework is STM32Cube (HAL + CMSIS). The Arduino framework is prohibited
; by section 6 / section 13 of the laboratory specification.
;
; PlatformIO's stm32cube builder does not compile the FreeRTOS kernel that
; ships inside framework-stm32cubef1, so scripts/freertos_build.py wires it
; in. See the header of that script for details.

[platformio]
; The firmware is the default target of a bare `pio run`.
;
; Both environments are listed because PlatformIO resolves the environments
; of a *bare* `pio test` from this same list: platformio/test/helpers.py
; skips a suite whose environment is not in default_envs, and `test_filter` /
; `test_ignore` only choose the test *suites inside* an environment, never
; the environment itself.  So `native` has to be here for the section 44
; command `pio test` to reach the host suites - and everything listed here is
; also visited by `pio run`, which is exactly what scripts/native_host_main.py
; exists to satisfy.  bluepill stays first, so get_default_env() (used by
; `pio device monitor` and friends) still resolves to the firmware.
default_envs = bluepill_f103c8, native

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:scripts/freertos_build.py
; The board links newlib-nano, whose printf() silently drops every %f
; conversion unless the floating-point formatter is pulled in.  Section 20
; reports temperature and humidity as floats, so both the OLED (display.cpp)
; and the serial line would otherwise print an empty value.
build_flags = -Wl,-u,_printf_float
; Sections 42-44 keep every unit test hardware-independent and host-run, so
; the firmware environment deliberately hosts no test suites.  PlatformIO
; cannot run them here anyway: the `stm32cube` framework has no Unity
; configuration for the embedded runner (`pio test -e bluepill_f103c8` dies
; with "Could not find Unity configuration for the `stm32cube` framework"
; before a single line of application code is built), and with no board
; attached the upload step could not succeed either.  Ignoring the suites is
; what lets a bare `pio test` reach the native ones instead of erroring out
; on this environment.
test_ignore = *

; Host unit tests (sections 42-44).  evaluateTemperature(), evaluateSystemState()
; and nextDisplayMode()/previousDisplayMode() are all pure, so the suites
; compile src/alarm.cpp and src/input.cpp unchanged and run them on the
; desktop; the hardware half of those two files (buzzer_init/AlarmTask,
; input_init/InputTask) is compiled against the declarations in test/stubs/,
; which exist only so the STM32 HAL and FreeRTOS includes resolve - nothing
; in the test links against them.  The state rules live header-only in
; system_state.h, so test_state includes them directly.
; This keeps the production sources free of #ifdefs while still testing the
; exact objects the firmware runs.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<alarm.cpp> +<input.cpp>
build_flags = -I test/stubs
; Only for the `pio run` half of the default_envs rule above: links a stub
; main outside a test build so the bare `pio run` still reports SUCCESS.
; Inert during `pio test`.  See the header of that script.
extra_scripts = pre:scripts/native_host_main.py
