; BCA182 Embedded Systems Programming
; Laboratory Activity No. 1 - Real-Time Multisensor Room Monitoring System
;
; Framework is STM32Cube (HAL + CMSIS). The Arduino framework is prohibited
; by section 6 / section 13 of the laboratory specification.
;
; PlatformIO's stm32cube builder does not compile the FreeRTOS kernel that
; ships inside framework-stm32cubef1, so scripts/freertos_build.py wires it
; in. See the header of that script for details.

[platformio]
; The firmware is the default target of a bare `pio run`. The native
; environment below exists only for `pio test -e native` (section 44) and
; must not be built as firmware - it has no ARM toolchain and no HAL.
default_envs = bluepill_f103c8

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200
extra_scripts = pre:scripts/freertos_build.py
; The board links newlib-nano, whose printf() silently drops every %f
; conversion unless the floating-point formatter is pulled in.  Section 20
; reports temperature and humidity as floats, so both the OLED (display.cpp)
; and the serial line would otherwise print an empty value.
build_flags = -Wl,-u,_printf_float

; Host unit tests (sections 42-44).  evaluateTemperature() is pure, so the
; test compiles src/alarm.cpp unchanged and runs it on the desktop; the
; hardware half of that file (buzzer_init/AlarmTask) is compiled against the
; declarations in test/stubs/, which exist only so the STM32 HAL and FreeRTOS
; includes resolve - nothing in the test links against them.  This keeps the
; production sources free of #ifdefs while still testing the exact object the
; firmware runs.
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<alarm.cpp>
build_flags = -I test/stubs
